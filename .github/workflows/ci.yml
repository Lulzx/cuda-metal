name: CI

# spec.md §10.7: every merged commit runs the functional suite on an Apple Silicon device.
# Correctness only -- the performance ratio gate is deliberately excluded here, both because
# §10.7 says performance is not gated in CI and because the bench measures wall-clock ratios
# that flake badly on a shared/loaded runner. Release performance is gated by
# `bench_phase5_all_kernels` on a quiet machine instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 is Apple Silicon. Override with a self-hosted M-series runner (spec §10.7's
    # `ci-m1`) by setting the repository variable CUMETAL_RUNNER, e.g. to "self-hosted,macos".
    runs-on: ${{ vars.CUMETAL_RUNNER || 'macos-15' }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration users install. The binary-shim alias is off here, which is exactly
          # why this job matters: the source-recompilation path must be green without it.
          - name: release-shim-off
            build_type: Release
            binary_shim: "OFF"
          # Adds the libcuda.dylib alias, covering the opt-in drop-in path and its tests.
          - name: debug-shim-on
            build_type: Debug
            binary_shim: "ON"

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      # cumetalc's CUDA frontend needs a clang built with NVPTX support; Apple's clang has none.
      - name: Install LLVM
        run: |
          brew install llvm cmake ninja
          echo "CUMETAL_CUDA_CLANG=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCUMETAL_ENABLE_BINARY_SHIM=${{ matrix.binary_shim }}

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # Guards the blocker this matrix exists for: the registration ABI backs the source path and
      # must be present regardless of the binary-shim setting. A missing symbol here means the
      # two switches have been re-conflated.
      - name: Verify registration ABI is present
        run: |
          if ! nm -gU build/libcumetal.dylib | grep -q cudaRegisterFatBinary; then
            echo "::error::libcumetal exports no CUDA registration symbols; the source path is broken"
            exit 1
          fi
          echo "registration ABI present"

      - name: Verify libcuda alias matches the shim setting
        run: |
          if [ "${{ matrix.binary_shim }}" = "ON" ]; then
            test -L build/libcuda.dylib || { echo "::error::expected libcuda.dylib alias"; exit 1; }
          else
            test ! -e build/libcuda.dylib || { echo "::error::unexpected libcuda.dylib alias"; exit 1; }
          fi

      - name: Test
        run: bash scripts/ci_report.sh build --exclude-regex '^bench_'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.name }}
          path: build/Testing/Temporary/
          retention-days: 14

  # Installs to a prefix and builds a CUDA program with the installed cumetalc, which is the only
  # way to catch install-layout breakage (missing headers, missing ptxas/fatbinary shims). The
  # build tree finds those by accident; an install does not.
  installed-toolchain:
    runs-on: ${{ vars.CUMETAL_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew install llvm cmake ninja
          echo "CUMETAL_CUDA_CLANG=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cmake --install build --prefix "$PWD/_prefix"

      - name: Compile and run a CUDA program with the installed cumetalc
        run: |
          set -euo pipefail
          ./_prefix/bin/cumetalc samples/vectorAdd/vectorAdd.cu -o /tmp/vectorAdd
          OUTPUT="$(CUMETAL_TRACE_GPU=1 /tmp/vectorAdd 2>&1)"
          echo "$OUTPUT"
          grep -q "PASS:" <<<"$OUTPUT" || { echo "::error::sample produced no PASS"; exit 1; }
          grep -q "device=apple_gpu" <<<"$OUTPUT" || {
            echo "::error::kernel did not dispatch to the Apple GPU"; exit 1; }
